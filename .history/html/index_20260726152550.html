
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Bookstore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="/assets/images/logo.png" class="logo-img" alt="logo">
            <p>Book Shop</p>
        </div>
        <nav>
            <ul class="top-bar">
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#features">Catalog</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="home-section">
            <div class="hero-container">
                <div class="hero-text">
                    <h1>Mystery<br>Bookstore</h1>
                    <p>UNRAVEL A MYSTERY WITH EVERY TURN OF THE PAGE.</p>
                    <a href="about.html" class="explore-btn">Explore Books</a>
                </div>

                <div class="hero-books">
                    <img src="assets/images/detective.jpg" class="book book1" alt="detective book cover">
                    <img src="assets/images/mystery.jpg" class="book book2" alt="mystery novel">
                    <img src="assets/images/adventure.jpg" class="book book3" alt="adventure book">
                </div>
            </div>
        </section>

        <section id="features" class="features-section">
            <h2 class="section-title">Featured Books</h2>
            <p class="section-subtitle">Famous Book For This Week</p>

        </section>
    </main>

    <footer>
        <div class="footer-info">
            <p>📍 221B Baker Street, London</p>
            <p>&copy; 2026 Book Shop. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
