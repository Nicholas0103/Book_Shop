
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Mystery Bookstore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="/assets/images/logo.png" class="logo-img" alt="logo">
            <p>Book Shop</p>
        </div>
        <nav>
            <ul class="top-bar">
                <li><a href="#home" class="active">Home</a></li>

                        </a>
                        <button class="buy-btn">Buy</button>

                    <div class="book-card">
                        <a href="index.html?book=5" class="book-cover-link">
                            <img src="/assets/book/book_5.png" alt="The Locked Study Mystery" class="book-cover">
                        </a>

                </div>

                <button class="arrow-btn right-arrow" id="nextBtn" aria-label="Next Books">&#9658;</button>

        <section id="features" class="features-section">
